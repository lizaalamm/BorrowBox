    <meta name="twitter:image" content="/og-image.png" />
    <title>BorrowBox - Borrow anything from neighbours who already own it</title>
    <script>
      // Apply the stored theme before paint so there is no flash of the wrong palette.
      (function () {
        try {
          var stored = window.localStorage.getItem('borrowbox_theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* storage unavailable, fall back to the light theme */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
